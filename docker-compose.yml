name: ledger-core-express-prisma-rabbitmq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ledger
      RABBITMQ_DEFAULT_PASS: ledger
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      # Only dependency download uses host networking; runtime stays on Compose's private network.
      network: host
    environment:
      PORT: 3000
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
      RABBITMQ_URL: amqp://ledger:ledger@rabbitmq:5672
      STACK_NAME: express-prisma-rabbitmq
      QUEUE_NAME: ledger.transfers.express_prisma
      # Deliberate 5s consumer delay so the queue can accumulate Ready messages.
      PROCESS_DELAY_MS: "5000"
      # Max unacked messages per consumer (default 5).
      PREFETCH: "5"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
