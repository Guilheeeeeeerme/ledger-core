name: ledger-core-nestjs-prisma-bullmq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      # Only dependency download uses host networking; runtime stays on Compose's private network.
      network: host
    environment:
      PORT: 3000
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
      REDIS_URL: redis://redis:6379
      STACK_NAME: nestjs-prisma-bullmq
      QUEUE_NAME: ledger.bullmq
      BULLMQ_QUEUE: ledger.bullmq
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
