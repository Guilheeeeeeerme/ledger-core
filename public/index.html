<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger Flow</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">ACCOUNTING MVP</p>
      <h1>Ledger Flow</h1>
      <p class="subtitle">API → Redis/BullMQ → Worker → PostgreSQL</p>
    </div>
    <span id="health" class="status pending">connecting</span>
  </header>

  <main>
    <section>
      <div class="section-heading">
        <div><p class="eyebrow">01</p><h2>Accounts</h2></div>
        <button id="refresh" class="secondary">Refresh</button>
      </div>
      <div id="accounts" class="account-grid"></div>
    </section>

    <section class="transfer-panel">
      <div class="section-heading"><div><p class="eyebrow">02</p><h2>New transfer</h2></div></div>
      <form id="transfer-form">
        <label>Source<select id="source" required></select></label>
        <span class="arrow">→</span>
        <label>Destination<select id="destination" required></select></label>
        <label>Amount (BRL)<input id="amount" type="number" min="0.01" step="0.01" value="25.00" required></label>
        <label>Description<input id="description" maxlength="120" value="Demo transfer"></label>
        <button type="submit">Send through broker</button>
      </form>
      <div id="flow" class="flow" hidden>
        <span>API</span><b>→</b><span>Redis/BullMQ</span><b>→</b><span>Worker</span><b>→</b><span>PostgreSQL</span>
      </div>
      <p id="feedback" class="feedback"></p>
    </section>

    <section>
      <div class="section-heading"><div><p class="eyebrow">03</p><h2>Transaction history</h2></div></div>
      <label class="history-select">Account<select id="history-account"></select></label>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Description</th><th>Counterparty</th><th>Amount</th></tr></thead>
          <tbody id="history"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
